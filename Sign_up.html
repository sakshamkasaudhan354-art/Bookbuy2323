<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bookbuy | Student Registration</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f3f6fc;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 450px;
    background: white;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 8px 30px #00000012;
}

.logo {
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    color: #2563eb;
    margin-bottom: 10px;
}

h2 {
    text-align: center;
    margin-bottom: 10px;
    color: #17233c;
}

.subtitle {
    text-align: center;
    color: #667085;
    font-size: 14px;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
    font-size: 14px;
    color: #344054;
}

input, select {
    width: 100%;
    padding: 13px;
    margin-bottom: 18px;
    border: 1px solid #d5dce8;
    border-radius: 7px;
    outline: none;
    font-size: 14px;
    background: white;
}

input:focus, select:focus {
    border-color: #2563eb;
}

button {
    width: 100%;
    padding: 14px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.footer {
    text-align: center;
    margin-top: 20px;
    color: #667085;
    font-size: 14px;
}

.footer a {
    color: #2563eb;
    text-decoration: none;
    font-weight: bold;
}
.secondary-btn {
    background: white;
    color: #2563eb;
    border: 1px solid #2563eb;
    margin-bottom: 18px;
    padding: 11px;
    font-size: 14px;
}
.secondary-btn:hover { background: #eaf1ff; }
button:disabled { background: #9db8f0; cursor: not-allowed; }
#status { text-align: center; font-size: 14px; margin-bottom: 15px; min-height: 18px; }

/* Password eye icon */
.password-box { position: relative; width: 100%; }
.password-box input { padding-right: 48px; }
.password-box .toggle-password {
    position: absolute; top: 22px; right: 8px; transform: translateY(-50%);
    width: 35px; height: 35px; margin: 0; padding: 0;
    background: transparent; border: none; color: #667085; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
}
.password-box .toggle-password:hover { background: transparent; color: #2563eb; }
</style>
</head>

<body>

<div class="container">

    <div class="logo">Bookbuy.</div>
    <h2>Student Registration</h2>
    <p class="subtitle">Create your account to explore academic resources.</p>

    <form id="signupForm">

        <label>Email Address</label>
        <input type="email" id="email" placeholder="Enter your email address" required>
        <button type="button" id="sendBtn" class="secondary-btn">Send OTP</button>

        <label>OTP</label>
        <input type="text" id="otp" placeholder="Enter 6-digit OTP" maxlength="6" inputmode="numeric">
        <button type="button" id="verifyBtn" class="secondary-btn">Verify OTP</button>

        <div id="status"></div>

        <label>Password</label>
        <div class="password-box">
            <input type="password" id="password" placeholder="Create your password (min 8 characters)" required minlength="8">
            <button type="button" class="toggle-password" aria-label="Show password">
                <svg class="eye-open" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-off" style="display:none" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
        </div>

        <label>University Name</label>
        <select id="university" required>
            <option value="">Select University</option>
            <option value="AKTU">AKTU</option>
            <option value="LU">University of Lucknow</option>
            <option value="BBD">Babu Banarasi Das University</option>
            <option value="Other">Other University</option>
        </select>

        <label>College Name</label>
        <input type="text" id="college" placeholder="Enter your college name" required>

        <button type="submit" id="createBtn" disabled>Create Account</button>

    </form>

    <div class="footer">
        Already have an account? <a href="login.html">Login</a>
    </div>

</div>

<script>
const API = "https://bookbuy2323.onrender.com";
const emailEl = document.getElementById("email");
const statusEl = document.getElementById("status");
const createBtn = document.getElementById("createBtn");

function setStatus(msg, ok) {
    statusEl.textContent = msg;
    statusEl.style.color = ok ? "#16a34a" : "#dc2626";
}

async function post(path, body) {
    try {
        const res = await fetch(API + path, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
        });
        return await res.json();
    } catch (err) {
        return { success: false, message: "Backend se connect nahi ho paya" };
    }
}

// Password dikhane / chhupane wala eye button
document.querySelectorAll(".toggle-password").forEach(btn => {
    btn.addEventListener("click", () => {
        const input = btn.parentElement.querySelector("input");
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        btn.querySelector(".eye-open").style.display = show ? "none" : "block";
        btn.querySelector(".eye-off").style.display = show ? "block" : "none";
        btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
    });
});

// Email badla to dobara verify karna padega
emailEl.addEventListener("input", () => {
    createBtn.disabled = true;
    setStatus("", true);
});

document.getElementById("sendBtn").addEventListener("click", async () => {
    const email = emailEl.value.trim();
    if (!email) return setStatus("Pehle email daalo", false);
    setStatus("OTP bhej rahe hain...", true);
    const data = await post("/send-otp", { email });
    setStatus(data.message, data.success);
});

document.getElementById("verifyBtn").addEventListener("click", async () => {
    const email = emailEl.value.trim();
    const otp = document.getElementById("otp").value.trim();
    if (!otp) return setStatus("OTP daalo", false);
    const data = await post("/verify-otp", { email, otp });
    setStatus(data.message, data.success);
    if (data.success) createBtn.disabled = false;
});

document.getElementById("signupForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const data = await post("/register", {
        email: emailEl.value.trim(),
        password: document.getElementById("password").value,
        university: document.getElementById("university").value,
        college: document.getElementById("college").value.trim()
    });
    if (data.success) {
        alert("Account ban gaya! Ab login karo.");
        window.location.href = "login.html";
    } else {
        setStatus(data.message, false);
    }
});
</script>

</body>
</html>
