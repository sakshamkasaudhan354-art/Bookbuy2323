<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Bookbuy</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
body { background: #f4f6fb; padding: 20px 4%; max-width: 600px; margin: 0 auto; }
h2 { color: #172554; margin-bottom: 4px; }
.sub { color: #64748b; font-size: 13px; margin-bottom: 18px; }
.card { background: white; border: 1px solid #e1e5ee; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
.card b { color: #172554; }
.row { font-size: 14px; margin-bottom: 6px; word-break: break-all; }
.btns { display: flex; gap: 8px; margin-top: 10px; }
button { flex: 1; padding: 10px; border: none; border-radius: 7px; font-weight: bold; cursor: pointer; color: white; background: #2563eb; }
.ap { background: #16a34a; } .rj { background: #dc2626; }
input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; margin-bottom: 10px; }
.empty { text-align: center; color: #777; padding: 30px; }
.msg { font-size: 14px; color: #b91c1c; margin: 8px 0; min-height: 18px; }
</style>
</head>
<body>

<h2>Payment Requests</h2>
<p class="sub" id="who"></p>

<div id="loginArea" style="display:none">
    <input type="email" id="lemail" placeholder="Admin email">
    <input type="password" id="lpass" placeholder="Password">
    <button id="loginBtn">Login</button>
</div>

<p class="msg" id="msg"></p>
<div id="list"></div>

<script>
const API = "https://bookbuy2323.onrender.com";
const $ = id => document.getElementById(id);
const token = () => localStorage.getItem("bookbuy_token");
const esc = t => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

async function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
    if (token()) opts.headers.Authorization = "Bearer " + token();
    try {
        const res = await fetch(API + path, opts);
        let data = {};
        try { data = await res.json(); } catch (e) {}
        return { status: res.status, data: data };
    } catch (e) {
        return { status: 0, data: { message: "Server se connect nahi ho paya. 1 minute baad dobara try karo." } };
    }
}

async function load() {
    if (!token()) { $("loginArea").style.display = "block"; $("list").innerHTML = ""; return; }
    $("loginArea").style.display = "none";
    $("msg").textContent = "";
    $("list").innerHTML = '<div class="empty">Loading...</div>';

    const r = await api("/admin/payment-requests");
    if (r.status === 401) { localStorage.removeItem("bookbuy_token"); load(); return; }
    if (r.status === 403) {
        $("list").innerHTML = '<div class="empty">Ye page sirf admin ke liye hai.<br><br><button id="logoutBtn" style="max-width:260px">Dusre account se login karo</button></div>';
        $("logoutBtn").onclick = () => { localStorage.removeItem("bookbuy_token"); load(); };
        return;
    }
    if (!r.data.success) { $("list").innerHTML = '<div class="empty">' + esc(r.data.message || "Error") + '</div>'; return; }

    $("who").textContent = "Admin panel";
    const reqs = r.data.requests;
    if (!reqs.length) { $("list").innerHTML = '<div class="empty">Koi pending request nahi hai.</div>'; return; }

    $("list").innerHTML = "";
    reqs.forEach(q => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML =
            '<div class="row">📧 <b>' + esc(q.email) + '</b></div>' +
            '<div class="row">UTR: <b>' + esc(q.utr) + '</b></div>' +
            '<div class="row">Amount: ₹' + esc(q.amount) + '</div>' +
            '<div class="btns"><button class="ap">Approve</button><button class="rj">Reject</button></div>';
        card.querySelector(".ap").onclick = () => decide(q, true);
        card.querySelector(".rj").onclick = () => decide(q, false);
        $("list").appendChild(card);
    });
}

async function decide(q, approve) {
    if (!confirm((approve ? "Approve" : "Reject") + " karna hai? " + q.email)) return;
    const r = await api("/admin/decide", { method: "POST", body: JSON.stringify({ email: q.email, approve: approve }) });
    if (!r.data.success) { $("msg").textContent = r.data.message || "Nahi hua."; return; }
    load();
}

$("loginBtn").addEventListener("click", async () => {
    const email = $("lemail").value.trim().toLowerCase();
    const password = $("lpass").value;
    if (!email || !password) { $("msg").textContent = "Email aur password daalo."; return; }
    const r = await api("/login", { method: "POST", body: JSON.stringify({ email: email, password: password }) });
    if (!r.data.success || !r.data.token) { $("msg").textContent = r.data.message || "Login nahi hua. Naya otp.py deploy hua?"; return; }
    localStorage.setItem("bookbuy_token", r.data.token);
    load();
});

load();
</script>

</body>
</html>
