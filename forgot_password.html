<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bookbuy - Forgot Password</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f4f6f9;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    background: white;
    width: 400px;
    max-width: 90%;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 5px 20px #0001;
}

h2 {
    text-align: center;
    color: #2563eb;
}

p {
    text-align: center;
    color: #666;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 6px;
    margin: 10px 0;
}

button {
    width: 100%;
    padding: 13px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    background: #1d4ed8;
}

.otp-container {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin: 20px 0;
}

.otp-container input {
    width: 45px;
    height: 50px;
    text-align: center;
    font-size: 22px;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<div class="container">

<h2>Bookbuy</h2>

<!-- Email Section -->

<div id="emailSection">

<p>Forgot your password?</p>

<input type="email"
       id="email"
       placeholder="Enter your email address">

<button onclick="sendOTP()">
Send OTP
</button>

</div>


<!-- OTP Section -->

<div id="otpSection" class="hidden">

<p>Enter the 6-digit OTP sent to your email</p>

<div class="otp-container">

<input type="text" maxlength="1" inputmode="numeric">
<input type="text" maxlength="1" inputmode="numeric">
<input type="text" maxlength="1" inputmode="numeric">
<input type="text" maxlength="1" inputmode="numeric">
<input type="text" maxlength="1" inputmode="numeric">
<input type="text" maxlength="1" inputmode="numeric">

</div>

<button onclick="verifyOTP()">
Verify OTP
</button>

</div>


<!-- New Password Section -->

<div id="passwordSection" class="hidden">

<p>Create your new password</p>

<input type="password" id="newPassword"
       placeholder="Enter new password">

<input type="password" id="confirmPassword"
       placeholder="Confirm new password">

<button onclick="resetPassword()">
Reset Password
</button>

</div>

</div>

<script>
    if (sessionStorage.getItem("goLogin") === "1") {
    sessionStorage.removeItem("goLogin");
    window.location.replace("login.html");
}
    const API = "http://127.0.0.1:5000";   // Flask server ka URL
let userEmail = "";

let otpBoxes = document.querySelectorAll(".otp-container input");

// OTP boxes me auto-move
otpBoxes.forEach((box, index) => {
    box.addEventListener("input", function() {
        this.value = this.value.replace(/\D/g, "");
        if (this.value && index < 5) {
            otpBoxes[index + 1].focus();
        }
    });

    box.addEventListener("keydown", function(event) {
        if (event.key === "Backspace" && this.value === "" && index > 0) {
            otpBoxes[index - 1].focus();
        }
    });
});

async function sendOTP() {
    let email = document.getElementById("email").value.trim().toLowerCase();
    if (email === "") { alert("Please enter your email"); return; }

    let res = await fetch(API + "/forgot-send-otp", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
    });
    let data = await res.json();
    if (!data.success) { alert(data.message); return; }

    userEmail = email;
    document.getElementById("emailSection").classList.add("hidden");
    document.getElementById("otpSection").classList.remove("hidden");
}

async function verifyOTP() {
    let otp = Array.from(otpBoxes).map(b => b.value).join("");
    if (otp.length !== 6) { alert("Enter 6-digit OTP"); return; }

    let res = await fetch(API + "/verify-otp", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: userEmail, otp })
    });
    let data = await res.json();
    if (!data.success) { alert(data.message); return; }

    document.getElementById("otpSection").classList.add("hidden");
    document.getElementById("passwordSection").classList.remove("hidden");
}

async function resetPassword() {
    let pw = document.getElementById("newPassword").value;
    let cpw = document.getElementById("confirmPassword").value;
    if (pw.length < 8) { alert("Password kam se kam 8 character ka ho"); return; }
    if (pw !== cpw) { alert("Passwords match nahi kar rahe"); return; }

    sessionStorage.setItem("goLogin", "1");

    let res = await fetch(API + "/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: userEmail, password: pw })
    });
    let data = await res.json();
    if (!data.success) {
        sessionStorage.removeItem("goLogin");
        alert(data.message);
        return;
    }

    sessionStorage.removeItem("goLogin");
    window.location.replace("login.html");
}

</script>

</body>
</html>
