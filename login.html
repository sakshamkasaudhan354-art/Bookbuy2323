<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bookbuy | Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6fb;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-container {
    background: white;
    width: 90%;
    max-width: 420px;
    padding: 40px 30px;
    border-radius: 15px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    text-align: center;
}

.logo {
    font-size: 32px;
    font-weight: bold;
    color: #2563eb;
    margin-bottom: 10px;
}

h2 {
    margin-bottom: 10px;
    color: #222;
}

.subtitle {
    color: #777;
    margin-bottom: 30px;
    font-size: 14px;
}

.input-group {
    text-align: left;
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: bold;
    color: #333;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 7px;
    outline: none;
    font-size: 15px;
}

input:focus {
    border-color: #2563eb;
}

.login-btn {
    width: 100%;
    padding: 13px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.login-btn:hover {
    background: #1d4ed8;
}

.signup-link {
    margin-top: 25px;
    font-size: 14px;
    color: #555;
}

.signup-link a {
    color: #2563eb;
    text-decoration: none;
    font-weight: bold;
}

.signup-link a:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<div class="login-container">

    <div class="logo">Bookbuy</div>
    <p class="subtitle">
        Login to continue your learning journey.
    </p>

    <form id="loginForm">

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email"
                   placeholder="Enter your email"
                   required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password"
                   placeholder="Enter your password"
                   required>
            <div style="text-align:right; margin-top:8px;">
                <a href="forgot_password.html"
                   style="font-size:13px; color:#2563eb; text-decoration:none;">
                    Forgot Password?
                </a>
            </div>
        </div>

        <button type="submit" class="login-btn">
            Login
        </button>

    </form>

    <div class="signup-link">
        Create New Account?
        <a href="Sign_up.html">Sign Up</a>
    </div>

</div>

<script>
const API_URL = "http://127.0.0.1:5000";
const DEFAULT_PAGE = "after_direct_login.html"

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    const res = await fetch(API_URL + "/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if (data.success) {
      localStorage.setItem("bookbuyLoggedIn","true");
      const next = new URLSearchParams(location.search).get("next");
      window.location.href = next ||"after_direct_login.html";
    } else {
      alert(data.message);
    }
  } catch (err) {
    alert("Backend se connect nahi ho paya");
  }
});
</script>

</body>
</html>
